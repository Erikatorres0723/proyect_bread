<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - PanAmazonas</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #FFF8F0;
            font-family: 'Segoe UI', serif;
        }
        .cuadro-recuperar {
            background-color: #FFFFFF;
            padding: 45px 55px;
            border-radius: 12px;
            border: 3px solid #E8B86D;
            box-shadow: 0 4px 15px rgba(139, 90, 43, 0.15);
            text-align: center;
            width: 380px;
        }
        .titulo-con-icono {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .titulo-con-icono h1 {
            font-size: 32px;
            margin: 0;
            color: #8B5A2B;
            font-weight: bold;
        }
        .icono {
            font-size: 30px;
        }
        h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
            color: #A06E37;
        }
        h3 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #8B5A2B;
            border-bottom: 2px solid #F0D0A0;
            padding-bottom: 10px;
        }
        .descripcion {
            color: #7A5C42;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .campo-con-icono {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .icono-campo {
            font-size: 20px;
        }
        input {
            padding: 10px 12px;
            width: 240px;
            font-size: 15px;
            border: 1px solid #E0C090;
            border-radius: 6px;
            background-color: #FFFAF3;
        }
        input:focus {
            outline: none;
            border-color: #D49A4A;
        }
        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .btn-regresar {
            padding: 10px 22px;
            font-size: 15px;
            cursor: pointer;
            background-color: #F0D0A0;
            color: #8B5A2B;
            border: none;
            border-radius: 6px;
            text-decoration: none;
        }
        .btn-regresar:hover {
            background-color: #E8C08C;
        }
        .btn-enviar {
            padding: 10px 22px;
            font-size: 15px;
            cursor: pointer;
            background-color: #D49A4A;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
        }
        .btn-enviar:hover {
            background-color: #B8833A;
        }
    </style>
</head>
<body>
    <div class="cuadro-recuperar">
        <div class="titulo-con-icono">
            <span class="icono">🔑</span>
            <h1>PanAmazonas</h1>
        </div>
        <h2>Panadería y Pastelería</h2>
        <h3>RECUPERAR CONTRASEÑA</h3>

        <p class="descripcion">
            Escribe tu correo electrónico y te enviaremos un código de 4 dígitos para recuperar tu contraseña.
        </p>

        <div class="campo-con-icono">
            <span class="icono-campo">📧</span>
            <input type="email" placeholder="Correo electrónico">
        </div>

        <div class="botones">
            <a href="index.html" class="btn-regresar">← Regresar</a>
            <button class="btn-enviar">Enviar Código</button>
        </div>
    </div>
</body>
</html>
