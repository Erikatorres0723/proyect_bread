<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto - PanAmazonas</title>
    <style>
        body {
            background-color: #FFF8F0;
            font-family: 'Segoe UI', serif;
            min-height: 100vh;
            display: flex;
            margin: 0;
        }
        /* Barra lateral */
        .barra-lateral {
            width: 220px;
            background-color: #B6864C;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
        }
        .barra-lateral h2 {
            color: #FFFFFF;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .boton-lateral {
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .boton-lateral:hover {
            background-color: #966A3C;
        }
        .boton-lateral.activo {
            background-color: #966A3C;
            font-weight: bold;
        }
        .espacio {
            flex-grow: 1;
        }
        .btn-regresar {
            display: block;
            background-color: #F2D6A0;
            color: #8B6A40;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-regresar:hover {
            background-color: #E8C88C;
        }
        .btn-cerrar {
            display: block;
            background-color: #C85050;
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
        }
        .btn-cerrar:hover {
            background-color: #B04040;
        }
        /* Contenido principal */
        .contenido-principal {
            flex-grow: 1;
            padding: 30px 40px;
        }
        .barra-usuario {
            background-color: #F2E0C9;
            color: #5D4037;
            padding: 12px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .barra-usuario .etiqueta-activa {
            background-color: #4A90D9;
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .encabezado-pagina {
            margin-bottom: 30px;
        }
        .encabezado-pagina h1 {
            color: #B6864C;
            font-size: 32px;
        }
        .encabezado-pagina p {
            color: #8B7355;
            font-size: 16px;
            margin-top: 5px;
        }
        /* Formulario */
        .formulario {
            background-color: #FFFFFF;
            padding: 35px;
            border-radius: 12px;
            border: 2px solid #F2C970;
            max-width: 550px;
        }
        .grupo-form {
            margin-bottom: 20px;
        }
        .grupo-form label {
            display: block;
            color: #8B6A40;
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .grupo-form input, .grupo-form select, .grupo-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #E0C090;
            border-radius: 6px;
            font-size: 15px;
            background-color: #FFFAF3;
        }
        .grupo-form input:focus, .grupo-form select:focus, .grupo-form textarea:focus {
            outline: none;
            border-color: #D49A4A;
        }
        .botones-form {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }
        .btn-guardar {
            background-color: #4A90D9;
            color: #FFFFFF;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-guardar:hover {
            background-color: #357ABD;
        }
        .btn-cancelar {
            background-color: #F2D6A0;
            color: #8B6A40;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-cancelar:hover {
            background-color: #E8C88C;
        }
    </style>
</head>
<body>

    <!-- Barra lateral -->
    <div class="barra-lateral">
        <h2>Menú</h2>
        
        <a href="productos.html" class="boton-lateral activo">📦 Volver a Productos</a>
        <a href="ventas.html" class="boton-lateral">🛒 Ventas y Facturas</a>
        <a href="clientes.html" class="boton-lateral">👤 Clientes</a>
        <a href="proveedores.html" class="boton-lateral">🏭 Proveedores</a>
        <a href="empleados.html" class="boton-lateral">👥 Empleados</a>
        <a href="reportes.html" class="boton-lateral">📊 Reportes</a>
        
        <div class="espacio"></div>
        
        <a href="menu.html" class="btn-regresar">← Regresar al Inicio</a>
        <a href="index.html" class="btn-cerrar">🔒 Cerrar Sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="contenido-principal">
        <div class="barra-usuario">
            <span>👋 Bienvenida, Tatiana Torres</span>
            <span class="etiqueta-activa">● Sección Activa</span>
        </div>

        <div class="encabezado-pagina">
            <h1>Agregar Nuevo Producto</h1>
            <p>Completa los datos para registrar un producto nuevo</p>
        </div>

        <div class="formulario">
            <div class="grupo-form">
                <label>Nombre del Producto</label>
                <input type="text" placeholder="Escribe el nombre del producto">
            </div>

            <div class="grupo-form">
                <label>Descripción</label>
                <textarea rows="3" placeholder="Breve descripción del producto"></textarea>
            </div>

            <div class="grupo-form">
                <label>Precio Unitario</label>
                <input type="number" placeholder="0">
            </div>

            <div class="grupo-form">
                <label>Cantidad Inicial (Stock)</label>
                <input type="number" placeholder="0">
            </div>

            <div class="grupo-form">
                <label>Categoría</label>
                <select>
                    <option>Selecciona una categoría</option>
                    <option>Panadería</option>
                    <option>Pastelería</option>
                    <option>Bebidas</option>
                </select>
            </div>

            <div class="grupo-form">
                <label>Proveedor</label>
                <select>
                    <option>Selecciona un proveedor</option>
                    <option>Panadería El Sol</option>
                    <option>Distribuidora La Esperanza</option>
                </select>
            </div>

            <div class="botones-form">
                <button class="btn-guardar">✅ Guardar Producto</button>
                <a href="productos.html" class="btn-cancelar">❌ Cancelar</a>
            </div>
        </div>
    </div>

</body>
</html>
