<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta - PanAmazonas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #FFF8F0;
            font-family: 'Segoe UI', serif;
            min-height: 100vh;
            display: flex;
        }
        .barra-lateral {
            width: 220px;
            background-color: #B6864C;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
        }
        .barra-lateral h2 {
            color: #FFFFFF;
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .boton-lateral {
            color: #FFFFFF;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .boton-lateral:hover {
            background-color: #966A3C;
        }
        .boton-lateral.activo {
            background-color: #966A3C;
            font-weight: bold;
        }
        .espacio {
            flex-grow: 1;
        }
        .botones-abajo {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        .btn-regresar {
            display: block;
            background-color: #F2D6A0;
            color: #8B6A40;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 500;
        }
        .btn-regresar:hover {
            background-color: #E8C88C;
        }
        .btn-cerrar {
            display: block;
            background-color: #C85050;
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
        }
        .btn-cerrar:hover {
            background-color: #B04040;
        }
        .contenido-principal {
            flex-grow: 1;
            padding: 30px 40px;
        }
        .barra-usuario {
            background-color: #F2E0C9;
            color: #5D4037;
            padding: 12px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .barra-usuario .etiqueta-activa {
            background-color: #4A90D9;
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .encabezado-pagina {
            margin-bottom: 30px;
        }
        .encabezado-pagina h1 {
            color: #B6864C;
            font-size: 32px;
        }
        .encabezado-pagina p {
            color: #8B7355;
            font-size: 16px;
            margin-top: 5px;
        }
        .formulario-contenedor {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #F2C970;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #6B5A40;
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #E0C090;
            border-radius: 6px;
            font-size: 15px;
        }
        .fila-doble {
            display: flex;
            gap: 20px;
        }
        .fila-doble .form-group {
            flex: 1;
        }
        .botones-accion {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        .btn-guardar {
            background-color: #B6864C;
            color: #FFFFFF;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
            display: inline-block;
            text-align: center;
        }
        .btn-guardar:hover {
            background-color: #966A3C;
        }
        .btn-cancelar {
            background-color: #F2C970;
            color: #6B4A20;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }
        .btn-cancelar:hover {
            background-color: #E0B660;
        }
    </style>
</head>
<body>

    <div class="barra-lateral">
        <h2>Menú</h2>
        
        <a href="productos.html" class="boton-lateral">📦 Productos</a>
        <a href="ventas.html" class="boton-lateral activo">🛒 Ventas y Facturas</a>
        <a href="clientes.html" class="boton-lateral">👤 Clientes</a>
        <a href="proveedores.html" class="boton-lateral">🏭 Proveedores</a>
        <a href="empleados.html" class="boton-lateral">👥 Empleados</a>
        <a href="reportes.html" class="boton-lateral">📊 Reportes</a>
        
        <div class="espacio"></div>
        
        <div class="botones-abajo">
            <a href="ventas.html" class="btn-regresar">⬅️ Regresar a Ventas</a>
            <a href="index.html" class="btn-cerrar">🔒 Cerrar Sesión</a>
        </div>
    </div>

    <div class="contenido-principal">
        <div class="barra-usuario">
            <span>👋 Bienvenida, Tatiana Torres</span>
            <span class="etiqueta-activa">● Sección Activa</span>
        </div>

        <div class="encabezado-pagina">
            <h1>Generar Nueva Venta</h1>
            <p>Completa los datos para registrar una nueva venta en PanAmazonas</p>
        </div>

        <div class="formulario-contenedor">
            <div class="fila-doble">
                <div class="form-group">
                    <label>Número de Factura</label>
                    <input type="text" placeholder="000001">
                </div>
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date">
                </div>
            </div>

            <div class="form-group">
                <label>Nombre del Cliente</label>
                <input type="text" placeholder="Escribe el nombre del cliente">
            </div>

            <div class="form-group">
                <label>Cédula / Documento</label>
                <input type="text" placeholder="Ej: 1.002.345.678">
            </div>

            <div class="fila-doble">
                <div class="form-group">
                    <label>Producto</label>
                    <select>
                        <option>Selecciona un producto</option>
                        <option>Pan de Queso - $3.500</option>
                        <option>Pan de Leche - $2.000</option>
                        <option>Pan Integral - $2.500</option>
                        <option>Torta de Chocolate - $45.000</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" value="1" min="1">
                </div>
            </div>

            <div class="form-group">
                <label>Método de Pago</label>
                <select>
                    <option>Tarjeta</option>
                    <option>Efectivo</option>
                </select>
            </div>

            <div class="botones-accion">
                <a href="factura.html" class="btn-guardar">✅ Guardar y Generar Factura</a>
                <a href="ventas.html" class="btn-cancelar">❌ Cancelar</a>
            </div>
        </div>
    </div>

</body>
</html>
