<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Empleado - PanAmazonas</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background-color:#FFF8F0;font-family:'Segoe UI',serif;min-height:100vh;display:flex;}
        .barra-lateral{width:220px;background-color:#B6864C;padding:25px 15px;display:flex;flex-direction:column;}
        .barra-lateral h1{color:#FFF;font-size:22px;text-align:center;margin-bottom:30px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.3);}
        
        .boton-lateral{color:#FFF;text-decoration:none;padding:12px 15px;margin-bottom:8px;border-radius:6px;font-size:16px;position:relative;transition:all 0.2s ease;}
        .boton-lateral.activo{
            background-color: transparent;
            font-weight: 600;
            border-left: 4px solid #4A90D9;
            padding-left: 11px;
        }
        .boton-lateral:hover{background-color:rgba(255,255,255,0.15);}
        .espacio{flex-grow:1;}
        .botones-abajo{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.3);}
        .btn-regresar{display:block;background-color:#F2D6A0;color:#8B6A40;text-decoration:none;padding:10px 15px;border-radius:6px;text-align:center;margin-bottom:10px;font-size:15px;font-weight:500;}
        .btn-regresar:hover{background-color:#E8C88C;}
        .btn-cerrar{display:block;background-color:#C85050;color:#FFF;text-decoration:none;padding:10px 15px;border-radius:6px;text-align:center;font-size:15px;}
        .btn-cerrar:hover{background-color:#B04040;}
        
        .contenido-principal{flex-grow:1;padding:30px 40px;}
        
        .barra-usuario {
            background-color: #F2E0C9;
            color: #5D4037;
            padding: 12px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .barra-usuario .etiqueta-activa {
            background-color: #4A90D9;
            color: #FFFFFF;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .encabezado-pagina{margin-bottom:25px;text-align:center;}
        .encabezado-pagina h1{color:#B6864C;font-size:32px;}
        
        .formulario{
            background-color:#FFF;
            padding:35px;
            border-radius:10px;
            border:2px solid #F2C970;
            max-width:520px;
            margin:0 auto;
        }
        .formulario h2{
            color:#B6864C;
            text-align:center;
            margin-bottom:25px;
            font-size:22px;
        }
        .campo{margin-bottom:18px;}
        .campo label{
            display:block;
            font-weight:600;
            color:#5D4037;
            margin-bottom:6px;
            font-size:15px;
        }
        .campo input,
        .campo select{
            width:100%;
            padding:10px 12px;
            border:1px solid #E8D4B0;
            border-radius:6px;
            font-size:15px;
            background-color:#FFF9F0;
        }
        .campo input:focus,
        .campo select:focus{
            outline:none;
            border-color:#4A90D9;
        }
        
        .contenedor-botones{
            text-align:center;
            margin-top:30px;
            display:flex;
            gap:15px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .btn-guardar{
            background-color:#4A90D9;
            color:#FFF;
            padding:12px 30px;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
        .btn-guardar:hover{background-color:#357ABD;}
        .btn-cancelar{
            background-color:#E0E0E0;
            color:#555;
            padding:12px 30px;
            border:none;
            border-radius:6px;
            font-size:16px;
            text-decoration:none;
            display:inline-block;
        }
        .btn-cancelar:hover{background-color:#BDBDBD;}
    </style>
</head>
<body>
    <div class="barra-lateral">
        <h1>🥖 PanAmazonas</h1>
        <a href="productos.html" class="boton-lateral">📦 Productos</a>
        <a href="ventas.html" class="boton-lateral">🛒 Ventas y Facturas</a>
        <a href="clientes.html" class="boton-lateral">👤 Clientes</a>
        <a href="proveedores.html" class="boton-lateral">🏭 Proveedores</a>
        <a href="empleados.html" class="boton-lateral activo">👥 Empleados</a>
        <a href="reportes.html" class="boton-lateral">📊 Reportes</a>
        <div class="espacio"></div>
        
        <div class="botones-abajo">
            <a href="empleados.html" class="btn-regresar">⬅️ Regresar a Empleados</a>
            <a href="index.html" class="btn-cerrar">🔒 Cerrar Sesión</a>
        </div>
    </div>
    
    <div class="contenido-principal">
        <div class="barra-usuario">
            <span>👋 Bienvenida, Tatiana Torres</span>
            <span class="etiqueta-activa">● Sección Activa</span>
        </div>
        
        <div class="encabezado-pagina">
            <h1>✏️ Modificar Empleado</h1>
        </div>
        
        <form class="formulario" action="" method="post">
            <h2>Editar información de: Luisa Torres</h2>
            
            <div class="campo">
                <label>Documento (Cédula):</label>
                <input type="text" value="1012345678" readonly>
            </div>
            <div class="campo">
                <label>Nombres y Apellidos:</label>
                <input type="text" value="Luisa Torres">
            </div>
            <div class="campo">
                <label>Cargo:</label>
                <select>
                    <option>Panadero</option>
                    <option selected>Cajera</option>
                    <option>Vendedor</option>
                    <option>Repartidor</option>
                    <option>Administrativa</option>
                    <option>Auxiliar de apoyo</option>
                </select>
            </div>
            <div class="campo">
                <label>Teléfono:</label>
                <input type="text" value="320 222 3344">
            </div>
            <div class="campo">
                <label>💰 Salario mensual:</label>
                <input type="text" value="$1.300.000">
            </div>
            <div class="campo">
                <label>🏦 Banco:</label>
                <select>
                    <option selected>BBVA Colombia</option>
                    <option>Bancolombia</option>
                    <option>Davivienda</option>
                    <option>Banco de Bogotá</option>
                </select>
            </div>
            <div class="campo">
                <label>🔢 Número de cuenta:</label>
                <input type="text" value="098 765 4321">
            </div>
            <div class="campo">
                <label>📅 Fecha de ingreso:</label>
                <input type="date" value="2025-02-01">
            </div>
            <div class="campo">
                <label>🕒 Horario de trabajo:</label>
                <input type="text" value="8:00 a.m. — 6:00 p.m.">
            </div>
            <div class="campo">
                <label>📝 Tipo de contrato:</label>
                <select>
                    <option selected>Contrato indefinido</option>
                    <option>Contrato por obra o labor</option>
                    <option>Contrato a término fijo</option>
                    <option>Contrato de prestación de servicios</option>
                </select>
            </div>
            <div class="campo">
                <label>💳 Método de pago:</label>
                <select>
                    <option selected>Consignación bancaria</option>
                    <option>Efectivo</option>
                    <option>Cheque</option>
                </select>
            </div>
            
            <div class="contenedor-botones">
                <button type="submit" class="btn-guardar">💾 Guardar Cambios</button>
                <a href="ver_empleado_luisa.html" class="btn-cancelar">❌ Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
