<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada de Trabajo - PanAmazonas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #FFF8F0;
            font-family: 'Segoe UI', serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja {
            background-color: #FFFFFF;
            padding: 50px 40px;
            border-radius: 12px;
            border: 3px solid #F2C970;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .caja h1 {
            color: #B6864C;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .subtitulo {
            color: #8B7355;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .mensaje {
            background-color: #F2E0C9;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .mensaje h2 {
            color: #4A90D9;
            font-size: 22px;
            margin-bottom: 10px;
        }
        .mensaje p {
            color: #5D4037;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-facturar {
            background-color: #4A90D9;
            color: #FFFFFF;
            padding: 15px 40px;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-facturar:hover {
            background-color: #357ABD;
        }
        .cerrar {
            color: #C85050;
            font-size: 14px;
            text-decoration: none;
        }
        .cerrar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="caja">
        <h1>🥖 PanAmazonas</h1>
        <p class="subtitulo">Sistema de Facturación</p>

        <div class="mensaje">
            <h2>👋 ¡Hola, <span id="nombre"></span>!</h2>
            <p>¡Es un gusto verte hoy! ☀️<br>
            Estás aquí para atender a nuestros clientes.<br>
            Cuando estés lista, presiona el botón para empezar a facturar.</p>
        </div>

        <a href="facturacion.html" class="btn-facturar">🛒 Empezar a Facturar</a>
        <br>
        <a href="index.html" class="cerrar">🚪 Cerrar mi jornada de trabajo</a>
    </div>

    <script>
        // Mostramos el nombre de la cajera que inició sesión
        let nombre = localStorage.getItem("nombreUsuario");
        if (nombre) {
            document.getElementById("nombre").textContent = nombre;
        } else {
            // Si alguien entra directo sin iniciar sesión, lo enviamos al inicio
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
